<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050505">

<title>Das Leben ist zu kurz …</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --accent: #F12643;
  --background: #050505;
  --card: #101010;
}

body {
  margin: 0;
  min-height: 100svh;

  display: flex;
  justify-content: center;
  align-items: center;

  padding: 20px;

  background:
    radial-gradient(circle at 10% 5%, #321018, transparent 32%),
    radial-gradient(circle at 90% 95%, #25080e, transparent 32%),
    var(--background);

  color: #F5F5F5;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;
}

.card {
  width: 100%;
  max-width: 520px;

  padding: 42px 27px 30px;

  text-align: center;

  background: var(--card);

  border: 1px solid var(--accent);
  border-radius: 26px;

  box-shadow:
    0 28px 70px rgba(0, 0, 0, .58);
}

.headline {
  font-size: .78rem;
  line-height: 1.4;

  font-weight: 750;

  letter-spacing: .11em;
  text-transform: uppercase;

  color: var(--accent);
}

.line {
  width: 38px;
  height: 2px;

  margin: 17px auto;

  border-radius: 10px;

  background: var(--accent);
}

.title {
  margin: 20px 0;

  font-size: clamp(2rem, 9vw, 3.1rem);
  line-height: 1.05;

  font-weight: 300;
}

.text {
  max-width: 420px;

  margin: 0 auto;

  font-size: 1.03rem;
  line-height: 1.65;

  white-space: pre-line;
}

.greeting {
  margin-top: 26px;

  font-size: .88rem;
  line-height: 1.5;

  font-style: italic;
}

.ps {
  margin-top: 15px;

  font-size: .9rem;
  line-height: 1.5;
}

.ps-label {
  color: var(--accent);
  font-weight: 750;
}


/* ZÄHLER */

.stats {
  display: flex;
  justify-content: center;
  align-items: center;

  gap: 10px;

  margin-top: 30px;
}

.like-button,
.view-box {
  min-height: 45px;

  display: flex;
  justify-content: center;
  align-items: center;

  gap: 6px;

  padding: 10px 14px;

  border-radius: 14px;

  font: inherit;
  font-size: .82rem;
}

.like-button {
  border: 1px solid var(--accent);

  background: color-mix(
    in srgb,
    var(--accent) 12%,
    transparent
  );

  color: #fff;

  cursor: pointer;
}

.like-button:disabled {
  cursor: default;
  opacity: .55;
}

.view-box {
  border: 1px solid rgba(255, 255, 255, .09);

  background: rgba(255, 255, 255, .035);

  color: #aaa;
}

@media (max-width: 420px) {

  body {
    padding: 13px;
  }

  .card {
    padding: 36px 19px 27px;
    border-radius: 22px;
  }

  .stats {
    gap: 8px;
  }

  .like-button,
  .view-box {
    padding: 10px 11px;
    font-size: .77rem;
  }
}
</style>
</head>


<body>

<main class="card">

  <div id="headline" class="headline">
    🫵 AN DIE PERSON HINTER MIR:
  </div>

  <div class="line"></div>

  <div id="title" class="title">
    Das Leben ist zu kurz …
  </div>

  <div id="bodyText" class="text">
    Mach mehr von dem, was Dich glücklich macht. Lächle, hab Spaß und sei frei. ❤️
  </div>

  <div class="line"></div>

  <div id="greeting" class="greeting">
    Freundliche Grüße, die Person vor Dir
  </div>

  <div id="ps" class="ps">
    <span class="ps-label">PS: </span>
    <span id="psText">
      So wie Du bist, bist Du genau richtig. ❤️
    </span>
  </div>


  <div class="stats">

    <button
      id="likeButton"
      class="like-button"
      type="button"
      disabled
    >
      ❤️
      <span id="likes">0</span>
      Danke
    </button>

    <div class="view-box">
      👀
      <span id="views">0</span>
      Aufrufe
    </div>

  </div>

</main>


<script>

const SUPABASE_URL =
  "https://wbxwzspkoriyjmcbomxn.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_7-e-CafdZaT2CMCDhDH0DQ_qZLKzDVq";

const HOODIE =
  "hoodie3";

const headers = {
  "apikey": SUPABASE_KEY,
  "Authorization": "Bearer " + SUPABASE_KEY,
  "Content-Type": "application/json"
};


const fonts = {

  modern:
    '-apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif',

  elegant:
    'Georgia, "Times New Roman", serif',

  classic:
    '"Times New Roman", Times, serif',

  handwritten:
    '"Bradley Hand", "Brush Script MT", cursive',

  playful:
    '"Trebuchet MS", "Arial Rounded MT Bold", Arial, sans-serif'
};


/* =========================
   INHALTE
   ========================= */

async function loadContent() {

  try {

    const response =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/hoodie_content" +
        "?hoodie=eq.hoodie3&select=*",
        {
          headers: headers,
          cache: "no-store"
        }
      );

    if (!response.ok) {
      throw new Error();
    }

    const data =
      await response.json();

    if (!data.length) {
      return;
    }

    const c = data[0];


    document.getElementById("headline").textContent =
      c.headline || "";

    document.getElementById("title").textContent =
      c.title || "";

    document.getElementById("bodyText").textContent =
      c.body_text || "";

    document.getElementById("greeting").textContent =
      c.greeting || "";

    document.getElementById("psText").textContent =
      c.ps || "";


    /* SCHRIFTARTEN */

    document.getElementById("headline").style.fontFamily =
      fonts[c.headline_font] || fonts.modern;

    document.getElementById("title").style.fontFamily =
      fonts[c.title_font] || fonts.modern;

    document.getElementById("bodyText").style.fontFamily =
      fonts[c.text_font] || fonts.modern;

    document.getElementById("greeting").style.fontFamily =
      fonts[c.greeting_font] || fonts.modern;

    document.getElementById("ps").style.fontFamily =
      fonts[c.ps_font] || fonts.modern;


    /* TEXTFARBEN */

    document.getElementById("headline").style.color =
      c.headline_color || "#F12643";

    document.getElementById("title").style.color =
      c.title_color || "#F5F5F5";

    document.getElementById("bodyText").style.color =
      c.text_color || "#F5F5F5";

    document.getElementById("greeting").style.color =
      c.greeting_color || "#B8B8B8";

    document.getElementById("ps").style.color =
      c.ps_color || "#F5F5F5";


    /* DESIGN */

    document.documentElement.style.setProperty(
      "--accent",
      c.accent_color || "#F12643"
    );

    document.documentElement.style.setProperty(
      "--background",
      c.background_color || "#050505"
    );

    document.documentElement.style.setProperty(
      "--card",
      c.card_color || "#101010"
    );


  } catch (error) {

    console.error(
      "Hoodie-Inhalte konnten nicht geladen werden."
    );
  }
}


/* =========================
   STATISTIK
   ========================= */

let resetVersion = 0;


function showStats(data) {

  document.getElementById("views").textContent =
    data.views ?? 0;

  document.getElementById("likes").textContent =
    data.likes ?? 0;

  resetVersion =
    data.reset_version ?? 0;

  updateLikeButton();
}


async function registerView() {

  try {

    const response =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/rpc/hoodie_view",
        {
          method: "POST",
          headers: headers,

          body: JSON.stringify({
            p_hoodie: HOODIE
          })
        }
      );

    if (!response.ok) {
      throw new Error();
    }

    const data =
      await response.json();

    showStats(data);


  } catch (error) {

    await loadStats();
  }
}


async function loadStats() {

  try {

    const response =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/hoodie_stats" +
        "?hoodie=eq.hoodie3" +
        "&select=views,likes,reset_version",
        {
          headers: headers,
          cache: "no-store"
        }
      );

    if (!response.ok) {
      throw new Error();
    }

    const data =
      await response.json();

    if (data.length) {
      showStats(data[0]);
    }


  } catch (error) {

    document.getElementById("views").textContent =
      "?";

    document.getElementById("likes").textContent =
      "?";
  }
}


/* =========================
   DANKE
   ========================= */

function likeStorageKey() {

  return (
    HOODIE +
    "-liked-" +
    resetVersion
  );
}


function updateLikeButton() {

  const button =
    document.getElementById("likeButton");

  const liked =
    localStorage.getItem(
      likeStorageKey()
    ) === "yes";

  button.disabled =
    liked;

  button.style.opacity =
    liked ? ".55" : "1";
}


document.getElementById(
  "likeButton"
).addEventListener(
  "click",
  async function() {

    const button =
      document.getElementById(
        "likeButton"
      );

    if (
      localStorage.getItem(
        likeStorageKey()
      ) === "yes"
    ) {
      return;
    }

    button.disabled = true;


    try {

      const response =
        await fetch(
          SUPABASE_URL +
          "/rest/v1/rpc/hoodie_like",
          {
            method: "POST",
            headers: headers,

            body: JSON.stringify({
              p_hoodie: HOODIE
            })
          }
        );

      if (!response.ok) {
        throw new Error();
      }

      const data =
        await response.json();


      localStorage.setItem(
        likeStorageKey(),
        "yes"
      );

      showStats(data);


    } catch (error) {

      button.disabled = false;
    }
  }
);


/* =========================
   START
   ========================= */

async function start() {

  await loadContent();

  await registerView();
}


start();

</script>

</body>
</html>
