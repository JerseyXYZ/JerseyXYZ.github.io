<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050505">

<title>Das Leben ist zu kurz …</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --accent: #F12643;
  --background: #050505;
  --background2: #321018;
  --card: #101010;

  --accent-soft: rgba(241, 38, 67, .18);
  --accent-glow: rgba(241, 38, 67, .42);
}


/* =========================
   SEITE
   ========================= */

body {
  margin: 0;
  min-height: 100svh;

  display: flex;
  justify-content: center;
  align-items: center;

  padding: 20px;

  color: #F5F5F5;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;

  background:
    radial-gradient(
      circle at 10% 8%,
      var(--background2) 0%,
      transparent 38%
    ),
    radial-gradient(
      circle at 92% 92%,
      var(--background2) 0%,
      transparent 38%
    ),
    linear-gradient(
      145deg,
      var(--background),
      var(--background) 48%,
      var(--background2) 140%
    );

  background-attachment: fixed;
}


/* =========================
   KARTE
   ========================= */

.card {
  width: 100%;
  max-width: 520px;

  position: relative;

  padding: 42px 27px 30px;

  text-align: center;

  background:
    linear-gradient(
      145deg,
      color-mix(in srgb, var(--card) 96%, white 4%),
      var(--card)
    );

  border: 1.5px solid var(--accent);
  border-radius: 26px;

  box-shadow:
    0 0 8px var(--accent-soft),
    0 0 22px var(--accent-glow),
    0 28px 70px rgba(0, 0, 0, .58);
}


/* =========================
   TEXTE
   ========================= */

.headline {
  font-size: .78rem;
  line-height: 1.4;

  font-weight: 750;

  letter-spacing: .11em;
  text-transform: uppercase;

  color: var(--accent);
}

.line {
  width: 38px;
  height: 3px;

  margin: 17px auto;

  border-radius: 10px;

  background: var(--accent);

  box-shadow:
    0 0 7px var(--accent-glow);
}

.title {
  margin: 20px 0;

  font-size: clamp(2rem, 9vw, 3.1rem);
  line-height: 1.05;

  font-weight: 300;
}

.text {
  max-width: 420px;

  margin: 0 auto;

  font-size: 1.03rem;
  line-height: 1.65;

  white-space: pre-line;
}

.greeting {
  margin-top: 26px;

  font-size: .88rem;
  line-height: 1.5;

  font-style: italic;
}

.ps {
  margin-top: 15px;

  font-size: .9rem;
  line-height: 1.5;
}

.ps-label {
  color: var(--accent);

  font-weight: 800;

  text-shadow:
    0 0 8px var(--accent-soft);
}


/* =========================
   ZÄHLER
   ========================= */

.stats {
  display: flex;
  justify-content: center;
  align-items: stretch;

  gap: 10px;

  margin-top: 30px;
}

.like-button,
.view-box {
  min-height: 48px;

  display: flex;
  justify-content: center;
  align-items: center;

  gap: 7px;

  padding: 11px 15px;

  border-radius: 16px;

  font: inherit;
  font-size: .84rem;
}


/* DANKE */

.like-button {
  border: 1.5px solid var(--accent);

  background:
    linear-gradient(
      135deg,
      color-mix(
        in srgb,
        var(--accent) 38%,
        #111 62%
      ),
      color-mix(
        in srgb,
        var(--accent) 18%,
        #111 82%
      )
    );

  color: #FFFFFF;

  font-weight: 750;

  cursor: pointer;

  box-shadow:
    0 0 8px var(--accent-soft),
    0 0 16px var(--accent-soft);

  text-shadow:
    0 1px 2px rgba(0, 0, 0, .45);

  transition:
    transform .15s ease,
    box-shadow .15s ease,
    filter .15s ease;
}

.like-button:not(:disabled):active {
  transform: scale(.97);
}

.like-button:not(:disabled):hover {
  filter: brightness(1.12);

  box-shadow:
    0 0 10px var(--accent-glow),
    0 0 22px var(--accent-soft);
}


/*
   Bereits bedankt:
   weiterhin erkennbar,
   aber nicht mehr so extrem blass.
*/

.like-button:disabled {
  cursor: default;

  opacity: .78;
}


/* AUFRUFE */

.view-box {
  border: 1px solid rgba(255, 255, 255, .14);

  background: rgba(255, 255, 255, .045);

  color: #BDBDBD;
}


/* =========================
   HANDY
   ========================= */

@media (max-width: 420px) {

  body {
    padding: 13px;
  }

  .card {
    padding: 36px 19px 27px;

    border-radius: 22px;
  }

  .stats {
    gap: 8px;
  }

  .like-button,
  .view-box {
    padding: 10px 11px;

    font-size: .79rem;
  }
}
</style>
</head>


<body>

<main class="card">

  <div id="headline" class="headline">
    🫵 AN DIE PERSON HINTER MIR:
  </div>

  <div class="line"></div>

  <div id="title" class="title">
    Das Leben ist zu kurz …
  </div>

  <div id="bodyText" class="text">
    Mach mehr von dem, was Dich glücklich macht. Lächle, hab Spaß und sei frei. ❤️
  </div>

  <div class="line"></div>

  <div id="greeting" class="greeting">
    Freundliche Grüße, die Person vor Dir
  </div>

  <div id="ps" class="ps">

    <span class="ps-label">
      PS:
    </span>

    <span id="psText">
      So wie Du bist, bist Du genau richtig. ❤️
    </span>

  </div>


  <div class="stats">

    <button
      id="likeButton"
      class="like-button"
      type="button"
      disabled
    >
      ❤️
      <span id="likes">0</span>
      Danke
    </button>

    <div class="view-box">
      👀
      <span id="views">0</span>
      Aufrufe
    </div>

  </div>

</main>


<script>

const SUPABASE_URL =
  "https://wbxwzspkoriyjmcbomxn.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_7-e-CafdZaT2CMCDhDH0DQ_qZLKzDVq";

const HOODIE =
  "hoodie3";

const headers = {
  "apikey": SUPABASE_KEY,
  "Authorization": "Bearer " + SUPABASE_KEY,
  "Content-Type": "application/json"
};


const fonts = {

  modern:
    '-apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif',

  elegant:
    'Georgia, "Times New Roman", serif',

  classic:
    '"Times New Roman", Times, serif',

  handwritten:
    '"Bradley Hand", "Brush Script MT", cursive',

  playful:
    '"Trebuchet MS", "Arial Rounded MT Bold", Arial, sans-serif'
};


/* =========================
   FARBE → RGBA
   ========================= */

function hexToRgba(hex, alpha) {

  let value =
    String(hex || "")
      .replace("#", "")
      .trim();

  if (value.length !== 6) {
    return "rgba(241,38,67," + alpha + ")";
  }

  const r =
    parseInt(value.substring(0, 2), 16);

  const g =
    parseInt(value.substring(2, 4), 16);

  const b =
    parseInt(value.substring(4, 6), 16);

  return (
    "rgba(" +
    r + "," +
    g + "," +
    b + "," +
    alpha +
    ")"
  );
}


/* =========================
   INHALTE LADEN
   ========================= */

async function loadContent() {

  try {

    const response =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/hoodie_content" +
        "?hoodie=eq.hoodie3&select=*",
        {
          headers: headers,
          cache: "no-store"
        }
      );


    if (!response.ok) {
      throw new Error();
    }


    const data =
      await response.json();


    if (!data.length) {
      return;
    }


    const c =
      data[0];


    /* TEXTE */

    document.getElementById(
      "headline"
    ).textContent =
      c.headline || "";


    document.getElementById(
      "title"
    ).textContent =
      c.title || "";


    document.getElementById(
      "bodyText"
    ).textContent =
      c.body_text || "";


    document.getElementById(
      "greeting"
    ).textContent =
      c.greeting || "";


    document.getElementById(
      "psText"
    ).textContent =
      c.ps || "";


    /* SCHRIFTARTEN */

    document.getElementById(
      "headline"
    ).style.fontFamily =
      fonts[c.headline_font] ||
      fonts.modern;


    document.getElementById(
      "title"
    ).style.fontFamily =
      fonts[c.title_font] ||
      fonts.modern;


    document.getElementById(
      "bodyText"
    ).style.fontFamily =
      fonts[c.text_font] ||
      fonts.modern;


    document.getElementById(
      "greeting"
    ).style.fontFamily =
      fonts[c.greeting_font] ||
      fonts.modern;


    document.getElementById(
      "ps"
    ).style.fontFamily =
      fonts[c.ps_font] ||
      fonts.modern;


    /* TEXTFARBEN */

    document.getElementById(
      "headline"
    ).style.color =
      c.headline_color ||
      "#F12643";


    document.getElementById(
      "title"
    ).style.color =
      c.title_color ||
      "#F5F5F5";


    document.getElementById(
      "bodyText"
    ).style.color =
      c.text_color ||
      "#F5F5F5";


    document.getElementById(
      "greeting"
    ).style.color =
      c.greeting_color ||
      "#B8B8B8";


    document.getElementById(
      "ps"
    ).style.color =
      c.ps_color ||
      "#F5F5F5";


    /* DESIGNFARBEN */

    const accent =
      c.accent_color ||
      "#F12643";

    const background =
      c.background_color ||
      "#050505";

    const background2 =
      c.background_color_2 ||
      "#321018";

    const card =
      c.card_color ||
      "#101010";


    document.documentElement.style.setProperty(
      "--accent",
      accent
    );


    document.documentElement.style.setProperty(
      "--background",
      background
    );


    document.documentElement.style.setProperty(
      "--background2",
      background2
    );


    document.documentElement.style.setProperty(
      "--card",
      card
    );


    /*
      Glow-Farben automatisch
      aus der Akzentfarbe erzeugen.
    */

    document.documentElement.style.setProperty(
      "--accent-soft",
      hexToRgba(accent, .18)
    );


    document.documentElement.style.setProperty(
      "--accent-glow",
      hexToRgba(accent, .42)
    );


    /*
      Browserleiste auf
      Hintergrundfarbe abstimmen.
    */

    document
      .querySelector(
        'meta[name="theme-color"]'
      )
      .setAttribute(
        "content",
        background
      );


  } catch (error) {

    console.error(
      "Hoodie-Inhalte konnten nicht geladen werden."
    );
  }
}


/* =========================
   STATISTIK
   ========================= */

let resetVersion = 0;


function showStats(data) {

  document.getElementById(
    "views"
  ).textContent =
    data.views ?? 0;


  document.getElementById(
    "likes"
  ).textContent =
    data.likes ?? 0;


  resetVersion =
    data.reset_version ?? 0;


  updateLikeButton();
}


async function registerView() {

  try {

    const response =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/rpc/hoodie_view",
        {
          method: "POST",
          headers: headers,

          body: JSON.stringify({
            p_hoodie: HOODIE
          })
        }
      );


    if (!response.ok) {
      throw new Error();
    }


    const data =
      await response.json();


    showStats(data);


  } catch (error) {

    await loadStats();
  }
}


async function loadStats() {

  try {

    const response =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/hoodie_stats" +
        "?hoodie=eq.hoodie3" +
        "&select=views,likes,reset_version",
        {
          headers: headers,
          cache: "no-store"
        }
      );


    if (!response.ok) {
      throw new Error();
    }


    const data =
      await response.json();


    if (data.length) {
      showStats(data[0]);
    }


  } catch (error) {

    document.getElementById(
      "views"
    ).textContent =
      "?";


    document.getElementById(
      "likes"
    ).textContent =
      "?";
  }
}


/* =========================
   DANKE
   ========================= */

function likeStorageKey() {

  return (
    HOODIE +
    "-liked-" +
    resetVersion
  );
}


function updateLikeButton() {

  const button =
    document.getElementById(
      "likeButton"
    );


  const liked =
    localStorage.getItem(
      likeStorageKey()
    ) === "yes";


  button.disabled =
    liked;


  /*
    Nicht mehr auf 55 % ausblenden.
    Der Button bleibt kräftig sichtbar.
  */

  button.style.opacity =
    liked ? ".78" : "1";
}


document.getElementById(
  "likeButton"
).addEventListener(
  "click",
  async function() {

    const button =
      document.getElementById(
        "likeButton"
      );


    if (
      localStorage.getItem(
        likeStorageKey()
      ) === "yes"
    ) {
      return;
    }


    button.disabled =
      true;


    try {

      const response =
        await fetch(
          SUPABASE_URL +
          "/rest/v1/rpc/hoodie_like",
          {
            method: "POST",
            headers: headers,

            body: JSON.stringify({
              p_hoodie: HOODIE
            })
          }
        );


      if (!response.ok) {
        throw new Error();
      }


      const data =
        await response.json();


      localStorage.setItem(
        likeStorageKey(),
        "yes"
      );


      showStats(data);


    } catch (error) {

      button.disabled =
        false;
    }
  }
);


/* =========================
   START
   ========================= */

async function start() {

  await loadContent();

  await registerView();
}


start();

</script>

</body>
</html>
