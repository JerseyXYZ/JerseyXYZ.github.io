<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>J4F</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #111;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 30px 20px;
    }

    .page {
      width: 100%;
      max-width: 600px;
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 25px;
    }

    .text {
      font-size: 1.2rem;
      line-height: 1.6;
      margin-bottom: 35px;
    }

    .like {
      display: flex;
      justify-content: center;
      margin-top: 25px;
    }

    iframe {
      border: 0;
      width: 428px;
      max-width: 100%;
      height: 52px;
      background: transparent;
    }

    .footer {
      margin-top: 50px;
      font-size: 0.75rem;
      opacity: 0.4;
    }
  </style>
</head>

<body>

  <main class="page">

    <h1>Das Leben ist zu kurz ...</h1>

    <div class="text">
      Hier kommt dein persönlicher Text hin.<br>
      Diesen können wir später jederzeit ändern.
    </div>

    <div class="like">
      <iframe
        src="https://api.nice.sbs/e/n_0kiIXQNT2CsX?theme=mono-dark&size=xl"
        scrolling="no"
        allowtransparency="true"
        title="Nice button">
      </iframe>
    </div>

    <div class="footer">
      J4F
    </div>

  </main>

</body>
</html>
