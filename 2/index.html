<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J4F</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: #f5f5f5;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 25px;

  background:
    radial-gradient(circle at 15% 20%, rgba(150,0,20,.22), transparent 35%),
    radial-gradient(circle at 90% 80%, rgba(110,0,15,.18), transparent 40%),
    linear-gradient(135deg, #050505 0%, #111 45%, #050505 100%);
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: .22;
  background-image:
    repeating-linear-gradient(
      125deg,
      transparent 0px,
      transparent 35px,
      rgba(255,255,255,.025) 36px,
      transparent 37px
    );
}

.card {
  position: relative;
  width: 100%;
  max-width: 520px;
  padding: 46px 28px 38px;
  background: rgba(15,15,15,.72);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(180,20,35,.28);
  border-radius: 26px;
  box-shadow:
    0 25px 70px rgba(0,0,0,.65),
    0 0 45px rgba(130,0,20,.10);
  text-align: center;
}

.accent {
  width: 55px;
  height: 3px;
  margin: 0 auto 30px;
  border-radius: 10px;
  background: linear-gradient(90deg,#5d000c,#d51b32,#5d000c);
  box-shadow: 0 0 14px rgba(220,20,45,.45);
}

h1 {
  margin: 0 0 24px;
  font-size: clamp(1.8rem,7vw,2.7rem);
  font-weight: 400;
}

h1 strong {
  color: #e21c35;
}

.text {
  max-width: 420px;
  margin: auto;
  font-size: 1.08rem;
  line-height: 1.7;
  color: #d5d5d5;
}

.text p {
  margin: 0 0 1em;
}

.like {
  margin-top: 38px;
  display: flex;
  justify-content: center;
}

.like iframe {
  border: 0;
  width: 428px;
  max-width: 100%;
  height: 52px;
  background: transparent;
}

.footer {
  margin-top: 32px;
  font-size: .68rem;
  letter-spacing: .28em;
  color: #777;
}
</style>
</head>

<body>

<div class="card">

  <div class="accent"></div>

  <h1 id="title">...</h1>

  <div class="text" id="text">
    ...
  </div>

  <div class="like">
    <iframe
      src="https://api.nice.sbs/e/n_0kiIXQNT2CsX?theme=mono-dark&size=xl"
      scrolling="no"
      allowtransparency="true"
      title="Nice button">
    </iframe>
  </div>

  <div class="footer">J4F</div>

</div>

<script>
fetch('./content.json?nocache=' + Date.now())
  .then(response => response.json())
  .then(data => {
    document.getElementById('title').textContent = data.title;

    // Rich-Text-Inhalt von Pages CMS anzeigen
    document.getElementById('text').innerHTML = data.text;
  })
  .catch(error => {
    document.getElementById('title').textContent = 'J4F';
    document.getElementById('text').textContent =
      'Der Inhalt konnte gerade nicht geladen werden.';
    console.error(error);
  });
</script>

</body>
</html>
