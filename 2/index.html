<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Für die Person hinter mir ❤️</title>

<style>
* { box-sizing: border-box; }

:root {
  --text-color: #f5f5f5;
  --accent-color: #f12643;
  --background-color: #050505;
  --card-color: #101010;
  --page-font: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
}

body {
  margin: 0;
  min-height: 100svh;
  padding: 22px 16px;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: var(--page-font);
  color: var(--text-color);
  background:
    radial-gradient(circle at 5% 10%, color-mix(in srgb, var(--accent-color) 25%, transparent), transparent 32%),
    radial-gradient(circle at 95% 90%, color-mix(in srgb, var(--accent-color) 18%, transparent), transparent 34%),
    var(--background-color);
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: .25;
  background-image:
    repeating-linear-gradient(
      130deg,
      transparent 0,
      transparent 34px,
      rgba(255,255,255,.025) 35px,
      transparent 36px
    );
}

.card {
  position: relative;
  width: 100%;
  max-width: 500px;
  padding: 38px 25px 30px;
  overflow: hidden;
  text-align: center;
  background:
    linear-gradient(
      145deg,
      color-mix(in srgb, var(--card-color) 94%, white 6%),
      var(--card-color)
    );
  border: 1px solid color-mix(in srgb, var(--accent-color) 35%, transparent);
  border-radius: 25px;
  box-shadow:
    0 24px 65px rgba(0,0,0,.65),
    0 0 35px color-mix(in srgb, var(--accent-color) 8%, transparent);
}

.card::before {
  content: "";
  position: absolute;
  top: -1px;
  left: 25%;
  width: 50%;
  height: 2px;
  background: linear-gradient(
    90deg,
    transparent,
    var(--accent-color),
    transparent
  );
  box-shadow:
    0 0 18px color-mix(in srgb, var(--accent-color) 55%, transparent);
}

/* Kleine Überschrift jetzt besser lesbar */
.headline {
  color: var(--accent-color);
  font-size: .9rem;
  line-height: 1.4;
  font-weight: 750;
  letter-spacing: .13em;
  text-transform: uppercase;
}

.headline::after {
  content: "";
  display: block;
  width: 36px;
  height: 2px;
  margin: 17px auto 0;
  border-radius: 10px;
  background: var(--accent-color);
}

h1 {
  max-width: 520px;
  margin: 20px auto 22px;
  font-size: clamp(2rem, 7vw, 2.75rem);
  line-height: 1.08;
  font-weight: 300;
  letter-spacing: -.04em;
}

.text {
  max-width: 500px;
  margin: 0 auto;
  color: var(--text-color);
  opacity: .9;
  font-size: 1.05rem;
  line-height: 1.65;
  white-space: pre-line;
}

.message-end {
  width: 36px;
  height: 1px;
  margin: 26px auto 23px;
  background: var(--accent-color);
  opacity: .75;
}

.greeting {
  color: var(--text-color);
  opacity: .58;
  font-size: .88rem;
  line-height: 1.5;
  font-style: italic;
}

.ps {
  max-width: 500px;
  margin: 14px auto 0;
  color: var(--text-color);
  opacity: .88;
  font-size: .92rem;
  line-height: 1.5;
}

.ps-label {
  color: var(--accent-color);
  font-weight: 700;
}

/* Statistik */

.stats {
  position: relative;
  margin-top: 27px;
  padding-top: 23px;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 11px;
  flex-wrap: wrap;
}

.stats::before {
  content: "";
  position: absolute;
  top: 0;
  left: 25%;
  right: 25%;
  height: 1px;
  background: linear-gradient(
    90deg,
    transparent,
    rgba(255,255,255,.12),
    transparent
  );
}

.like-button,
.views {
  min-height: 44px;
  padding: 10px 15px;
  border-radius: 22px;
  border: 1px solid rgba(255,255,255,.10);
  background: rgba(255,255,255,.045);
  color: var(--text-color);
  font: inherit;
  font-size: .88rem;
  white-space: nowrap;
}

.like-button {
  cursor: pointer;
  transition: .2s ease;
}

.like-button:hover {
  border-color: var(--accent-color);
  background: color-mix(in srgb, var(--accent-color) 10%, transparent);
}

.like-button.liked {
  color: var(--text-color);
  border-color: var(--accent-color);
  background: color-mix(in srgb, var(--accent-color) 14%, transparent);
}

.like-button:disabled {
  cursor: default;
}

.stat-number {
  font-weight: 700;
  color: var(--text-color);
}


/* ---------- DESKTOP ---------- */

@media (min-width: 700px) {

  body {
    padding: 45px 30px;
  }

  .card {
    max-width: 680px;
    padding: 55px 55px 42px;
    border-radius: 30px;
  }

  .headline {
    font-size: 1rem;
    letter-spacing: .14em;
  }

  h1 {
    margin-top: 25px;
    margin-bottom: 28px;
    font-size: 3.2rem;
  }

  .text {
    font-size: 1.18rem;
    line-height: 1.7;
  }

  .greeting {
    font-size: .98rem;
  }

  .ps {
    font-size: 1rem;
  }

  .stats {
    margin-top: 34px;
    padding-top: 28px;
  }

  .like-button,
  .views {
    font-size: .95rem;
    padding: 11px 17px;
  }
}


/* ---------- MOBIL ---------- */

@media (max-width: 430px) {

  body {
    padding: 14px;
  }

  .card {
    padding: 32px 19px 25px;
    border-radius: 22px;
  }

  .headline {
    font-size: .82rem;
    letter-spacing: .10em;
  }

  h1 {
    margin-top: 18px;
    font-size: clamp(2rem, 10vw, 2.5rem);
  }

  .text {
    font-size: 1rem;
  }

  .message-end {
    margin-top: 23px;
  }

  .stats {
    gap: 8px;
  }

  .like-button,
  .views {
    font-size: .82rem;
    padding: 9px 12px;
  }
}
</style>
</head>

<body>

<main class="card">

  <div id="headline" class="headline"></div>
  <h1 id="title"></h1>
  <div id="text" class="text"></div>

  <div class="message-end"></div>

  <div id="greeting" class="greeting"></div>
  <div id="ps" class="ps"></div>

  <div class="stats">

    <button id="likeButton" class="like-button" type="button">
      ❤️ <span id="likes" class="stat-number">0</span> Danke
    </button>

    <div class="views">
      👀 <span id="views" class="stat-number">0</span> Aufrufe
    </div>

  </div>

</main>

<script>
/* ---------- TEXT + DESIGN AUS PAGES CMS ---------- */

fetch("./content.json?v=" + Date.now(), { cache: "no-store" })
  .then(response => {
    if (!response.ok) {
      throw new Error("Inhalt konnte nicht geladen werden.");
    }

    return response.json();
  })
  .then(data => {

    document.getElementById("headline").textContent =
      data.headline || "";

    document.getElementById("title").textContent =
      data.title || "";

    document.getElementById("text").textContent =
      data.text || "";

    document.getElementById("greeting").textContent =
      data.greeting || "";

    const ps = document.getElementById("ps");
    ps.innerHTML = "";

    if (data.ps) {
      const label = document.createElement("span");
      label.className = "ps-label";
      label.textContent = "PS: ";

      ps.appendChild(label);
      ps.appendChild(document.createTextNode(data.ps));
    }


    /* Farben */

    const root = document.documentElement;

    if (data.textColor) {
      root.style.setProperty("--text-color", data.textColor);
    }

    if (data.accentColor) {
      root.style.setProperty("--accent-color", data.accentColor);
    }

    if (data.backgroundColor) {
      root.style.setProperty("--background-color", data.backgroundColor);
    }

    if (data.cardColor) {
      root.style.setProperty("--card-color", data.cardColor);
    }


    /* Schriftarten */

    const fonts = {

      modern:
        '-apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif',

      elegant:
        'Georgia, "Times New Roman", serif',

      classic:
        '"Times New Roman", Times, serif',

      handwritten:
        '"Comic Sans MS", "Bradley Hand", cursive',

      playful:
        '"Trebuchet MS", Arial, sans-serif'
    };

    if (data.font && fonts[data.font]) {
      root.style.setProperty(
        "--page-font",
        fonts[data.font]
      );
    }

  })
  .catch(error => {
    console.error(error);

    document.getElementById("title").textContent =
      "Für die Person hinter mir ❤️";
  });


/* ---------- HOODIE STATISTIK ---------- */

const SUPABASE_URL =
  "https://wbxwzspkoriyjmcbomxn.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_7-e-CafdZaT2CMCDhDH0DQ_qZLKzDVq";

const HOODIE = "hoodie2";

const headers = {
  "apikey": SUPABASE_KEY,
  "Authorization": "Bearer " + SUPABASE_KEY,
  "Content-Type": "application/json"
};

const likesElement =
  document.getElementById("likes");

const viewsElement =
  document.getElementById("views");

const likeButton =
  document.getElementById("likeButton");

let currentResetVersion = 0;


/* Zahlen anzeigen + Like-Sperre */

function showStats(data) {

  if (!data) return;

  if (typeof data.likes !== "undefined") {
    likesElement.textContent = data.likes;
  }

  if (typeof data.views !== "undefined") {
    viewsElement.textContent = data.views;
  }

  if (typeof data.reset_version !== "undefined") {

    currentResetVersion = data.reset_version;

    const currentLikeKey =
      HOODIE + "-liked-" + currentResetVersion;

    if (localStorage.getItem(currentLikeKey) === "yes") {

      likeButton.classList.add("liked");
      likeButton.disabled = true;

    } else {

      likeButton.classList.remove("liked");
      likeButton.disabled = false;
    }
  }
}


/* Seitenaufruf zählen */

async function countView() {

  try {

    const response = await fetch(
      SUPABASE_URL + "/rest/v1/rpc/hoodie_view",
      {
        method: "POST",
        headers: headers,
        body: JSON.stringify({
          p_hoodie: HOODIE
        })
      }
    );

    if (!response.ok) {
      throw new Error(
        "Aufruf konnte nicht gezählt werden."
      );
    }

    const data = await response.json();

    showStats(data);

  } catch (error) {

    console.error("Statistik:", error);

    loadStats();
  }
}


/* Aktuelle Zahlen laden */

async function loadStats() {

  try {

    const response = await fetch(
      SUPABASE_URL +
      "/rest/v1/hoodie_stats?hoodie=eq." +
      HOODIE +
      "&select=views,likes,reset_version",
      {
        headers: headers
      }
    );

    if (!response.ok) {
      throw new Error(
        "Statistik konnte nicht geladen werden."
      );
    }

    const data = await response.json();

    if (data.length) {
      showStats(data[0]);
    }

  } catch (error) {

    console.error("Statistik:", error);
  }
}


/* Danke / Like */

likeButton.addEventListener(
  "click",
  async function () {

    const likeStorageKey =
      HOODIE +
      "-liked-" +
      currentResetVersion;

    if (
      localStorage.getItem(likeStorageKey) === "yes"
    ) {
      return;
    }

    likeButton.disabled = true;

    try {

      const response = await fetch(
        SUPABASE_URL +
        "/rest/v1/rpc/hoodie_like",
        {
          method: "POST",
          headers: headers,
          body: JSON.stringify({
            p_hoodie: HOODIE
          })
        }
      );

      if (!response.ok) {
        throw new Error(
          "Danke konnte nicht gespeichert werden."
        );
      }

      const data = await response.json();

      showStats(data);

      localStorage.setItem(
        likeStorageKey,
        "yes"
      );

      likeButton.classList.add("liked");
      likeButton.disabled = true;

    } catch (error) {

      console.error("Like:", error);

      likeButton.disabled = false;
    }
  }
);


/* Beim Öffnen +1 Aufruf */

countView();

</script>

</body>
</html>
