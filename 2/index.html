<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Für die Person hinter mir ❤️</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100svh;
  padding: 22px 16px;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  color: #f5f5f5;

  background:
    radial-gradient(circle at 5% 10%, rgba(125,0,20,.30), transparent 32%),
    radial-gradient(circle at 95% 90%, rgba(160,0,25,.22), transparent 34%),
    linear-gradient(145deg, #050505, #101010 55%, #070707);
}

/* dezente Struktur */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: .25;
  background-image:
    repeating-linear-gradient(
      130deg,
      transparent 0,
      transparent 34px,
      rgba(255,255,255,.025) 35px,
      transparent 36px
    );
}

.card {
  position: relative;
  width: 100%;
  max-width: 500px;
  padding: 38px 25px 30px;
  overflow: hidden;
  text-align: center;

  background:
    linear-gradient(
      145deg,
      rgba(18,18,18,.96),
      rgba(7,7,7,.96)
    );

  border: 1px solid rgba(205,25,48,.35);
  border-radius: 25px;

  box-shadow:
    0 24px 65px rgba(0,0,0,.65),
    0 0 35px rgba(170,0,25,.08);
}

/* roter Lichtakzent oben */
.card::before {
  content: "";
  position: absolute;
  top: -1px;
  left: 25%;
  width: 50%;
  height: 2px;

  background: linear-gradient(
    90deg,
    transparent,
    #ff1f42,
    transparent
  );

  box-shadow: 0 0 18px rgba(255,20,55,.55);
}

.headline {
  color: #f12643;
  font-size: .76rem;
  line-height: 1.4;
  font-weight: 750;
  letter-spacing: .18em;
  text-transform: uppercase;
}

.headline::after {
  content: "";
  display: block;
  width: 32px;
  height: 2px;
  margin: 17px auto 0;
  border-radius: 10px;
  background: #b4162c;
}

h1 {
  max-width: 410px;
  margin: 20px auto 22px;

  font-size: clamp(2rem, 7vw, 2.75rem);
  line-height: 1.08;
  font-weight: 300;
  letter-spacing: -.04em;
}

.text {
  max-width: 390px;
  margin: 0 auto;

  color: #e1e1e1;
  font-size: 1.05rem;
  line-height: 1.65;

  white-space: pre-line;
}

.message-end {
  width: 36px;
  height: 1px;
  margin: 26px auto 23px;
  background: rgba(225,28,55,.75);
}

.greeting {
  color: #999;
  font-size: .88rem;
  line-height: 1.5;
  font-style: italic;
}

.ps {
  max-width: 390px;
  margin: 14px auto 0;

  color: #ddd;
  font-size: .92rem;
  line-height: 1.5;
}

.ps-label {
  color: #f12643;
  font-weight: 700;
}

.like-area {
  position: relative;
  margin-top: 27px;
  padding-top: 22px;
}

.like-area::before {
  content: "";
  position: absolute;
  top: 0;
  left: 25%;
  right: 25%;
  height: 1px;

  background: linear-gradient(
    90deg,
    transparent,
    rgba(255,255,255,.12),
    transparent
  );
}

.like {
  display: flex;
  justify-content: center;
}

.like iframe {
  width: 428px;
  max-width: 100%;
  height: 52px;
  border: 0;
  background: transparent;
}

/* Smartphone */
@media (max-width: 430px) {
  body {
    padding: 14px;
  }

  .card {
    padding: 32px 19px 25px;
    border-radius: 22px;
  }

  .headline {
    font-size: .68rem;
    letter-spacing: .13em;
  }

  h1 {
    margin-top: 18px;
    font-size: clamp(2rem, 10vw, 2.5rem);
  }

  .text {
    font-size: 1rem;
  }

  .message-end {
    margin-top: 23px;
  }
}
</style>
</head>

<body>

<main class="card">

  <div id="headline" class="headline"></div>

  <h1 id="title"></h1>

  <div id="text" class="text"></div>

  <div class="message-end"></div>

  <div id="greeting" class="greeting"></div>

  <div id="ps" class="ps"></div>

  <div class="like-area">
    <div class="like">
      <iframe
        src="https://api.nice.sbs/e/n_0kiIXQNT2CsX?theme=mono-dark&size=xl"
        scrolling="no"
        allowtransparency="true"
        title="Danke">
      </iframe>
    </div>
  </div>

</main>

<script>
fetch("./content.json?v=" + Date.now(), { cache: "no-store" })
  .then(response => {
    if (!response.ok) throw new Error("Inhalt konnte nicht geladen werden.");
    return response.json();
  })
  .then(data => {

    document.getElementById("headline").textContent =
      data.headline || "";

    document.getElementById("title").textContent =
      data.title || "";

    document.getElementById("text").textContent =
      data.text || "";

    document.getElementById("greeting").textContent =
      data.greeting || "";

    const ps = document.getElementById("ps");

    if (data.ps) {
      const label = document.createElement("span");
      label.className = "ps-label";
      label.textContent = "PS: ";

      ps.appendChild(label);
      ps.appendChild(document.createTextNode(data.ps));
    }
  })
  .catch(error => {
    console.error(error);

    document.getElementById("title").textContent =
      "Für die Person hinter mir ❤️";
  });
</script>

</body>
</html>
