<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J4F</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  padding: 24px 18px;
  display: flex;
  justify-content: center;
  align-items: center;

  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  color: #f7f7f7;

  background:
    radial-gradient(circle at 15% 10%, rgba(190, 15, 40, .22), transparent 32%),
    radial-gradient(circle at 85% 90%, rgba(110, 0, 20, .22), transparent 35%),
    linear-gradient(145deg, #050505, #121212 50%, #050505);
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: .35;
  background:
    repeating-linear-gradient(
      125deg,
      transparent 0,
      transparent 38px,
      rgba(255,255,255,.025) 39px,
      transparent 40px
    );
}

.card {
  position: relative;
  width: 100%;
  max-width: 520px;
  padding: 42px 28px 34px;
  overflow: hidden;

  text-align: center;
  background: rgba(12,12,12,.82);

  border: 1px solid rgba(220,35,55,.25);
  border-radius: 28px;

  box-shadow:
    0 25px 80px rgba(0,0,0,.65),
    0 0 50px rgba(160,0,25,.10);
}

.card::before {
  content: "";
  position: absolute;
  top: 0;
  left: 15%;
  right: 15%;
  height: 1px;

  background: linear-gradient(
    90deg,
    transparent,
    #e21c35,
    transparent
  );
}

.headline {
  margin-bottom: 18px;

  color: #e21c35;
  font-size: .78rem;
  font-weight: 700;
  letter-spacing: .16em;
  text-transform: uppercase;
}

h1 {
  margin: 0 auto 27px;
  max-width: 430px;

  font-size: clamp(2rem, 8vw, 3rem);
  line-height: 1.08;
  font-weight: 300;
  letter-spacing: -.04em;
}

.text {
  max-width: 410px;
  margin: 0 auto;

  color: #dedede;
  font-size: 1.08rem;
  line-height: 1.7;

  white-space: pre-line;
}

.divider {
  width: 42px;
  height: 2px;
  margin: 30px auto;

  border-radius: 5px;
  background: #9e1728;
}

.greeting {
  color: #aaa;
  font-size: .92rem;
  font-style: italic;
}

.ps {
  margin-top: 17px;
  color: #eee;
  font-size: .95rem;
  line-height: 1.5;
}

.ps strong {
  color: #e21c35;
}

.like {
  margin-top: 32px;
  display: flex;
  justify-content: center;
}

.like iframe {
  width: 428px;
  max-width: 100%;
  height: 52px;

  border: 0;
  background: transparent;
}

.footer {
  margin-top: 27px;

  color: #555;
  font-size: .62rem;
  letter-spacing: .35em;
}

/* Kleine Handys */
@media (max-width: 420px) {
  .card {
    padding: 37px 21px 30px;
    border-radius: 23px;
  }

  .headline {
    font-size: .7rem;
  }

  .text {
    font-size: 1rem;
  }
}
</style>
</head>

<body>

<main class="card">

  <div id="headline" class="headline"></div>

  <h1 id="title"></h1>

  <div id="text" class="text"></div>

  <div class="divider"></div>

  <div id="greeting" class="greeting"></div>

  <div id="ps" class="ps"></div>

  <div class="like">
    <iframe
      src="https://api.nice.sbs/e/n_0kiIXQNT2CsX?theme=mono-dark&size=xl"
      scrolling="no"
      allowtransparency="true"
      title="Nice button">
    </iframe>
  </div>

  <div class="footer">J4F</div>

</main>

<script>
fetch("./content.json?v=" + Date.now(), { cache: "no-store" })
  .then(response => {
    if (!response.ok) {
      throw new Error("content.json konnte nicht geladen werden");
    }
    return response.json();
  })
  .then(data => {
    document.getElementById("headline").textContent = data.headline || "";
    document.getElementById("title").textContent = data.title || "";
    document.getElementById("text").textContent = data.text || "";
    document.getElementById("greeting").textContent = data.greeting || "";

    const ps = document.getElementById("ps");

    if (data.ps) {
      ps.innerHTML = "<strong>PS:</strong> ";
      ps.appendChild(document.createTextNode(data.ps));
    }
  })
  .catch(error => {
    console.error(error);

    document.getElementById("title").textContent = "J4F";
    document.getElementById("text").textContent =
      "Der Inhalt konnte gerade nicht geladen werden.";
  });
</script>

</body>
</html>
